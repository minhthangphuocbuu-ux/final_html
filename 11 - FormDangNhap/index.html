<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Form Đăng Nhập</title>
</head>

<body>
    <div class="container">
        <div class="content">
            <h1 class="header">Form đăng nhập</h1>
            <form action="" class="form">
                <div class="form__line">
                    <label for="username" class="form__label">Tên người dùng</label>
                    <input id="username" type="text" class="form__input" value="Minh Thắng">
                </div>
                <div class="form__line">
                    <label for="password" class="form__label">Mật khẩu</label>
                    <input id="password" type="password" class="form__input" value="dsfsd">
                </div>
                <button class="form__button">Đăng nhập</button>
                <p class="form__welcome">Chào bạn <span class="form__highlight">Minh Thắng</span></p>
            </form>
        </div>
    </div>
</body>

</html>
